name: Robot de noticias de El Mayordomo
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/noticias.json']
permissions:
  contents: write
concurrency:
  group: robot-noticias
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/robot-noticias.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "robot@users.noreply.github.com"
          git add data/noticias.json
          git diff --cached --quiet || git commit -m "Noticias del campo $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q || true
          git push
